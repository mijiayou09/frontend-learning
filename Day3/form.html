<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport">
        <title>表单练习</title>
    </head>
    <body>
        <form action="/submit" methon="post">
            <!--用户名-->
            <label for="username">用户名</label>
            <input tpye="text" id="username" placeholder="请输入用户名" required>
            <!--密码-->
            <label for="password">密码</label>
            <input type="password" id="password" name="password" minlength="6" placeholder="请输入密码" required>
            
            <p>意向岗位：</p>
            <input type="radio" id="fe" name="job" value="frontend" checked />
            <label for="fe">前端开发</label>
            <input type="radio" id="be" name="job" value="backend" />
            <label for="be">后端开发</label>
            <input type="checkbox" id="pm" name="job" value="pm" />
            <label for="pm">产品经理</label>

            <input type="checkbox" id="vue" name="learn" value="vue" checked />
            <label for="vue">vue</label>

            <p>意向城市：</p>
            <label for="city">城市</label>
            <select id="city" name="city">
                <option value="chengdu" selected>成都</option>
                <option value="shanghai">上海</option>
                <option value="beijing">北京</option>
            </select>
            <p></p>
            <label for="msg">留言</label>
            <textarea id="msg" name="msg" rows="4"></textarea>
            <button type="submit">提交</button>
            <p>手机号：</p>
            <input type="tel" pattern="1[3-9]\d{9}" title="请输入 11 位手机号" required />
        </form>
    </body>
</html>
