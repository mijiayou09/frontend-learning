<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport">
        <title>联系我</title>
    </head>
    <body>
        <form action="/submit" method="post">
            <label for="username">姓名</label>
            <input type="text" id="username" name="username" required />
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" required />
            <label for="tel">电话</label>
           <input type="tel" id="tel" name="tel" pattern="1[3-9]\d{9}" title="请输入 11 位手机号" required />
            <p>意向岗位：</p>
            <input type="radio" id="qianduan" name="job" value="qianduan" checked />
            <label for="qianduan">前端</label>
            <input type="radio" id="qianrushi" name="job" value="qianrushi" />
            <label for="qianrushi">嵌入式</label>
            <input type="radio" id="other" name="job" value="other" />
            <label for="other">其他</label>
            <p>想学的前端方向：</p>
            <input type="checkbox" id="HTML" name="direction" value="HTML" />
            <label for="HTML">HTML</label>
            <input type="checkbox" id="CSS" name="direction" value="CSS" />
            <label for="CSS">CSS</label>
            <input type="checkbox" id="JavaScript" name="direction" value="JavaScript" />
            <label for="JavaScript">JavaScript</label>
            <input type="checkbox" id="Vue" name="direction" value="Vue" />
            <label for="Vue">Vue</label>
            <input type="checkbox" id="dir-other" name="direction" value="dir-other" />
            <label for="dir-other">其他</label>
            <p>意向城市：</p>
            <label for="city">城市</label>
            <select id="city" name="city">
                <option value="chengdu" selected>成都</option>
                <option value="shanghai">上海</option>
                <option value="guangzhou">广州</option>
                <option value="shenzhen">深圳</option>
            </select>
            <p></p>
            <label for="msg">留言:</label>
           <textarea id="msg" name="msg" rows="4" maxlength="200"></textarea>
            <input type="submit" value="提交" />
            <input type="reset" value="重置" />
              </form>
    </body>
</html>
